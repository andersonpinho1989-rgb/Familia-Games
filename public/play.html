<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Família Games</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script><script src="/themes.js"></script><script src="/bidata.js"></script><script src="/audio.js"></script><script src="/dice.js"></script></head>
<body><div id="topbtns" style="position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:9"><button id="exitbtn" class="btn ghost" hidden style="width:auto;font-size:1rem;padding:6px 12px"></button><button id="snd" class="btn ghost" style="width:auto;font-size:1.2rem;padding:6px 12px" aria-label="Som">🔊</button></div><div id="app" style="max-width:480px;margin:auto;padding:58px 18px 18px"></div>
<script>
const $ = document.getElementById('app'); const $id = (i) => document.getElementById(i); const socket = io(); let S = null, tick = null;
const COLORS = ['#FF5A5F', '#FCA311', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5', '#8AC926', '#E9ECEF'];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz = (n = 30) => (navigator.vibrate && navigator.vibrate(n));
const act = (type, payload) => { buzz(); socket.emit('game:action', { type, payload }); };
const saved = () => JSON.parse(localStorage.getItem('me') || 'null');
let form = { room: new URLSearchParams(location.search).get('room') || '', name: '', color: COLORS[3], err: '' };

socket.on('connect', () => { // reconexão silenciosa: reassume o mesmo jogador
  const me = saved(); if (!me) return joinScreen();
  socket.emit('player:join', me, (r) => { if (r.error) { localStorage.removeItem('me'); form.err = r.error; joinScreen(); } });
});
socket.on('disconnect', () => { document.body.style.opacity = .6; });
socket.on('toast', (m) => alert(m));
socket.on('room:closed', () => { // a TV encerrou tudo: volta para a tela de entrada
  localStorage.removeItem('me'); form = { room: '', name: form.name, color: form.color, err: 'Sala encerrada. Escaneie o novo QR Code para entrar.' };
  clearInterval(tick); S = null; joinScreen();
});
let BUILD = null;
socket.on('state', (s) => {
  if (BUILD && s.build && s.build !== BUILD) return location.reload();
  BUILD = s.build; document.body.style.opacity = 1; S = s;
  GA.setTheme(s.phase === 'game' && s.gameId === 'ludo' && s.view ? s.view.theme : 'classic');
  try { render(); } catch (e) { $.innerHTML = '<pre style="white-space:pre-wrap;color:#FCA311">Erro: ' + esc(e.message) + '</pre>'; console.error(e); }
});

function joinScreen() {
  $id('exitbtn').hidden = true;
  $.innerHTML = `<h1 style="font-size:2.4em;margin:.2em 0">Entrar na sala</h1>
    <p style="color:#F15BB5;min-height:1.4em">${esc(form.err)}</p>
    <input class="field" id="room" placeholder="Código (4 letras)" maxlength="4" value="${esc(form.room)}" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:1.8rem">
    <input class="field" id="name" placeholder="Seu nome" maxlength="12" value="${esc(form.name)}" style="margin-top:12px">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0">${COLORS.map((c) => `<button data-c="${c}" aria-label="cor" style="aspect-ratio:1;border-radius:50%;background:${c};border:${c === form.color ? '5px solid #fff' : '5px solid transparent'}"></button>`).join('')}</div>
    <button class="btn" id="go">Entrar</button>`;
  $.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { form.room = $id('room').value; form.name = $id('name').value; form.color = b.dataset.c; joinScreen(); }));
  $id('go').onclick = () => {
    form = { ...form, room: $id('room').value.toUpperCase(), name: $id('name').value };
    socket.emit('player:join', { code: form.room, name: form.name, color: form.color }, (r) => {
      if (r.error) { GA.sfx('error'); form.err = r.error; return joinScreen(); }
      localStorage.setItem('me', JSON.stringify({ code: form.room, playerId: r.playerId })); buzz(60); GA.sfx('ok');
    });
  };
}

function render() {
  clearInterval(tick);
  const me = S.players.find((p) => p.id === S.me); if (!me) return;
  updateTop();
  const head = `<div class="chip" style="margin-bottom:14px"><i class="dot" style="background:${me.color}"></i>${esc(me.name)} · sala ${S.code}</div>`;
  const vip = S.me === S.vip;
  if (S.phase === 'lobby') {
    const g = S.games.find((x) => x.id === S.gameId), st = S.settings || {}, picks = S.picks || {};
    const optTxt = (o, val) => (o.labels && o.labels[val]) || (val + (o.suffix || ''));
    let opts = '', pick = '';
    if (g && g.options) opts = '<div class="panel" style="margin-top:12px">' + g.options.map((o) => vip
      ? `<div style="margin:6px 0 6px;font-weight:700">${esc(o.label)}</div><div style="display:flex;flex-wrap:wrap;gap:8px">${o.choices.map((c, ci) => `<button class="btn ${st[o.key] === c ? '' : 'ghost'}" data-o="${o.key}" data-ci="${ci}" style="width:auto;padding:10px 16px;font-size:1rem">${esc(optTxt(o, c))}</button>`).join('')}</div>`
      : `<div style="margin:6px 0">${esc(o.label)}: <b>${esc(optTxt(o, st[o.key]))}</b></div>`).join('') + '</div>';
    if (g && g.pick) {
      const th = THEMES[st.theme] || THEMES.classic;
      pick = `<div style="margin:14px 0 6px;font-weight:700">Escolha seu personagem / cor</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">` + th.seats.map((sd, k) => {
        const owner = Object.keys(picks).find((id) => picks[id] === k), mineSel = owner === S.me, other = owner && !mineSel, on = S.players.find((p) => p.id === owner);
        return `<button data-seat="${k}" ${other ? 'disabled' : ''} class="btn" style="background:${sd.c};color:#14213D;padding:12px 6px;border:4px solid ${mineSel ? '#fff' : 'transparent'};opacity:${other ? .35 : 1}"><span style="font-size:1.8rem">${sd.e}</span><br><small>${esc(sd.n)}</small>${other ? '<br><small>(' + esc(on ? on.name : '') + ')</small>' : ''}</button>`; }).join('') + '</div>';
    }
    $.innerHTML = head + `<h2 style="margin:.2em 0">${vip ? 'Escolha o jogo' : 'Aguardando o ⭐ iniciar…'}</h2>` +
      S.games.map((g2) => `<button class="btn ${S.gameId === g2.id ? '' : 'ghost'}" data-g="${g2.id}" ${!vip || !g2.available ? 'disabled' : ''} style="margin-bottom:10px;text-align:left">${g2.emoji} ${esc(g2.name)} <small>${g2.available ? `(${g2.min}–${g2.max})` : '· em breve'}</small></button>`).join('') +
      opts + pick + (vip ? `<button class="btn" id="start" ${S.gameId ? '' : 'disabled'} style="margin-top:14px;background:var(--ok)">Começar!</button>` : '');
    $.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => { buzz(); socket.emit('game:select', b.dataset.g); }));
    $.querySelectorAll('[data-o]').forEach((b) => (b.onclick = () => { buzz(); const o = g.options.find((x) => x.key === b.dataset.o); socket.emit('game:setting', { key: o.key, value: o.choices[+b.dataset.ci] }); }));
    $.querySelectorAll('[data-seat]').forEach((b) => (b.onclick = () => { buzz(); GA.sfx('ok'); socket.emit('player:pick', +b.dataset.seat); }));
    if (vip) document.getElementById('start').onclick = () => { GA.sfx('start'); buzz(60); socket.emit('game:start'); };
    return;
  }
  if (S.gameId === 'adedonha') adedonha(head, vip);
  else if (S.gameId === 'ludo') ludo(head, vip);
  else if (S.gameId === 'xadrez' || S.gameId === 'dama') boardgame(head, vip);
  else if (S.gameId === 'banco') bancoPhone(head, vip);
}

function adedonha(head, vip) {
  const v = S.view;
  if (v.phase !== lastPh) {
    lastPh = v.phase;
    if (v.phase === 'playing') GA.sfx('start'); else if (v.phase === 'final') GA.sfx('win');
    else if (v.phase === 'draw' && v.drawer === S.me) { buzz([200, 80, 200]); GA.sfx('turn'); }
  }
  if (v.phase === 'draw' || v.phase === 'spinning') {
    const mineDraw = v.drawer === S.me, dn = (S.players.find((p) => p.id === v.drawer) || { name: '?' }).name;
    $.innerHTML = head + `<h2 style="margin:.2em 0">Rodada ${v.round}/${v.rounds}</h2>` +
      (v.phase === 'spinning' ? `<div class="panel" style="text-align:center;font-size:2rem;padding:40px 10px">🎰 Sorteando…<br><small>olhe a TV</small></div>`
        : mineDraw ? `<button class="btn" id="spin" style="font-size:2rem;padding:34px">🎰 GIRAR A LETRA</button>`
        : `<div class="panel" style="text-align:center;font-size:1.4rem">Vez de <b>${esc(dn)}</b> girar a letra…</div>` + (vip ? `<button class="btn ghost" id="spin" style="margin-top:12px">🎰 Girar por ele(a) (você é o ⭐)</button>` : '')) +
      `<p style="opacity:.7">Letras já usadas: ${v.used.length ? v.used.join(' ') : 'nenhuma'}</p>`;
    if (v.phase === 'draw' && $id('spin')) $id('spin').onclick = () => { GA.sfx('dice'); act('spin'); };
    return;
  }
  if (v.phase === 'validating') {
    const y = window.scrollY, me = S.me, readyMe = v.ready.indexOf(me) >= 0;
    const chipH = (p) => `<span class="chip"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}</span>`;
    $.innerHTML = head + `<h2 style="margin:.2em 0">🔎 Validação · letra ${v.letter}</h2><p style="opacity:.85;margin:0 0 10px">Toque no botão das respostas que estiverem <b>erradas</b> (✗). <span id="vt"></span></p>` +
      S.players.filter((p) => p.id !== me).map((p) => `<div class="panel" style="margin-bottom:12px"><div style="margin-bottom:6px">${chipH(p)}</div>` +
        v.board[p.id].map((c, i) => c.e ? '' : `<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><div style="flex:1;min-width:0"><small style="opacity:.7">${esc(v.cats[i])}</small><br><b style="${c.a ? '' : 'text-decoration:line-through;color:#FF5A5F'}">${esc(c.t)}</b>${c.a ? '' : ' <small>inválida</small>'}</div>` +
          (c.a ? `<button data-t="${p.id}" data-c="${i}" class="btn ghost" style="width:68px;padding:14px 0;background:${v.mine.indexOf(p.id + '|' + i) >= 0 ? '#FF5A5F' : '#2EC4B6'};color:#14213D">${v.mine.indexOf(p.id + '|' + i) >= 0 ? '✗' : '✓'}</button>` : '') + '</div>').join('') + '</div>').join('') +
      `<button class="btn" id="rdy" ${readyMe ? 'disabled' : ''} style="background:var(--ok)">${readyMe ? 'Aguardando os outros…' : '✅ Terminei de validar'}</button>` +
      (vip ? `<button class="btn ghost" id="skipv" style="margin-top:10px">⏭ Encerrar validação agora (⭐)</button>` : '');
    document.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => act('vote', { target: b.dataset.t, cat: +b.dataset.c, reject: v.mine.indexOf(b.dataset.t + '|' + b.dataset.c) < 0 })));
    $id('rdy').onclick = () => { GA.sfx('ok'); act('ready'); };
    if ($id('skipv')) $id('skipv').onclick = () => act('skip');
    const off = Date.now() - v.serverNow, vt = $id('vt');
    const u = () => { vt.textContent = '· ' + Math.max(0, Math.ceil((v.endsAt - (Date.now() - off)) / 1000)) + 's'; }; u(); tick = setInterval(u, 500);
    window.scrollTo(0, y); return;
  }
  if (v.phase === 'playing') {
    const key = 'r' + v.round;
    if (!($id('stop') && playKey === key)) { // monta UMA vez por rodada: recriar os campos fecharia o teclado e apagaria o que está sendo digitado
      playKey = key;
      const last = v.cats.length - 1, dr = v.draft || [];
      $.innerHTML = head + `<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:5em;font-weight:800;color:var(--gold);line-height:1">${v.letter}</div><div id="t" style="font-size:3em;font-weight:800"></div></div>` +
        v.cats.map((c, i) => `<label style="display:block;margin:10px 0 4px;font-weight:700">${esc(c)}</label><input class="field a" data-i="${i}" value="${esc(dr[i] || '')}" autocomplete="off" autocorrect="off" autocapitalize="words" enterkeyhint="${i === last ? 'done' : 'next'}" placeholder="${v.letter}…">`).join('') +
        `<button class="btn" id="stop" style="margin-top:18px;background:#FF5A5F;color:#fff;font-size:2rem">STOP!</button>`;
      const inputs = [...document.querySelectorAll('.a')], get = () => inputs.map((i) => i.value);
      let deb; const send = () => { clearTimeout(deb); socket.emit('game:action', { type: 'draft', payload: { answers: get() } }); }; // sem vibrar a cada tecla
      inputs.forEach((inp, i) => {
        inp.oninput = () => { clearTimeout(deb); deb = setTimeout(send, 350); };
        inp.onblur = send;
        inp.onkeydown = (e) => { // tecla "Próximo"/Enter do teclado: vai para a categoria seguinte
          if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); if (inputs[i + 1]) inputs[i + 1].focus(); else inp.blur(); }
        };
      });
      $id('stop').onclick = () => { GA.sfx('stop'); buzz([80, 40, 80]); socket.emit('game:action', { type: 'stop', payload: { answers: get() } }); };
    }
    const off = Date.now() - v.serverNow, t = $id('t');
    const u = () => { t.textContent = Math.max(0, Math.ceil((v.endsAt - (Date.now() - off)) / 1000)); };
    u(); tick = setInterval(u, 250); return;
  }
  if (v.phase === 'results') {
    const mine = v.ranking.findIndex((r) => r.id === S.me) + 1;
    $.innerHTML = head + `<h2>Olhe a TV 📺</h2><p>Você está em <b>${mine}º</b> lugar.</p>` +
      `<button class="btn" id="nx">Próxima rodada ➜</button>`;
    $id('nx').onclick = () => act('next'); return;
  }
  $.innerHTML = head + `<h2>Fim de jogo! 🏆</h2>` + (vip ? `<button class="btn" id="end">Voltar ao menu</button>` : '');
  if (vip) $id('end').onclick = () => socket.emit('game:end');
}

// ================= LUDO (celular) =================
let LC = ['#E5484D', '#3BB273', '#F2C14E', '#4D96FF'], LT = THEMES.classic, lastBuzz = '', PDIE = null, PN = null;
function ludo(head, vip) {
  const v = S.view; LT = THEMES[v.theme] || THEMES.classic; LC = LT.seats.map((x) => x.c);
  const sd = LT.seats[v.seat], col = sd.c, mine = v.pos[S.me];
  const nm = (id) => { const p = S.players.find((x) => x.id === id), t = LT.seats[v.seats[id]]; return t.e + ' ' + t.n + ' (' + (p ? p.name : '?') + ')'; };
  const k = v.turn + v.phase + v.dice;
  if (v.myTurn && v.phase === 'roll' && k !== lastBuzz) { lastBuzz = k; buzz([200, 80, 200]); GA.sfx('turn'); }
  if (!$id('pdie')) { // monta uma vez: o dado 3D precisa continuar na tela para animar
    $.innerHTML = head + `<div id="ppanel" class="panel" style="text-align:center;border:5px solid ${col}"><div id="pwho" style="opacity:.8;font-size:.95rem"></div><div id="ptitle" style="font-size:1.4rem;font-weight:800"></div>
      <div id="pdie" style="display:flex;justify-content:center;padding:18px 0 12px"></div><div id="pmsg" style="opacity:.85;min-height:1.5em"></div></div><div id="pctl"></div>`;
    PDIE = Dice.create($id('pdie'), 84); PN = null;
  }
  $id('ppanel').style.borderColor = col; $id('pdie').style.setProperty('--pip', col);
  $id('pwho').textContent = 'Você é ' + sd.e + ' ' + sd.n;
  $id('ptitle').textContent = v.phase === 'over' ? '🏆 ' + nm(v.winner) + ' venceu!' : v.myTurn ? 'Sua vez!' : 'Vez de ' + nm(v.turn);
  $id('pmsg').textContent = v.msg || '';
  if (PN === null) PDIE.set(v.dice || 1); else if (v.rollN !== PN) PDIE.roll(v.dice || 1);
  PN = v.rollN;
  let h = '';
  if (v.myTurn && v.phase === 'roll') h += `<button class="btn" id="roll" style="margin-top:16px;font-size:2rem;padding:28px;background:${col};color:#14213D">🎲 ROLAR DADO</button>`;
  else if (v.myTurn && v.phase === 'move') {
    h += `<p style="text-align:center;font-weight:700;margin:14px 0 8px">Toque na peça que quer mover</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">` +
      mine.map((p, i) => { const ok = v.movable.includes(i), lbl = p === -1 ? 'Na base' : p === 56 ? 'Em casa 🏁' : p > 50 ? 'Reta final' : `Casa ${p + 1}`;
        return `<button data-p="${i}" ${ok ? '' : 'disabled'} class="btn ${ok ? '' : 'ghost'}" style="background:${ok ? col : ''};color:${ok ? '#14213D' : ''};padding:20px 8px"><span style="font-size:2.2rem">${i + 1}</span><br><small>${lbl}</small></button>`; }).join('') + '</div>';
  } else if (v.phase !== 'over') h += `<p style="text-align:center;opacity:.8;margin-top:14px">Suas peças: ${mine.filter((p) => p === -1).length} na base · ${mine.filter((p) => p >= 0 && p < 56).length} no tabuleiro · ${mine.filter((p) => p === 56).length}/4 em casa</p>`;
  if (v.phase === 'over' && vip) h += `<button class="btn" id="end" style="margin-top:16px">Voltar ao menu</button>`;
  if (vip && v.phase !== 'over') h += `<button class="btn ghost" id="vw" style="margin-top:16px;font-size:1rem;padding:10px">🖥 TV: tabuleiro ${v.view === '2d' ? '2D → mudar para 3D' : '3D → mudar para 2D'}</button>`;
  $id('pctl').innerHTML = h;
  if ($id('roll')) $id('roll').onclick = () => { GA.sfx('dice'); act('roll'); };
  document.querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => { GA.sfx('move'); act('move', { piece: +b.dataset.p }); }));
  if ($id('end')) $id('end').onclick = () => socket.emit('game:end');
  if ($id('vw')) $id('vw').onclick = () => socket.emit('game:setting', { key: 'view', value: v.view === '2d' ? '3d' : '2d' });
}

// ================= XADREZ / DAMA (celular) =================
const BGL = { K: '\u265A', Q: '\u265B', R: '\u265C', B: '\u265D', N: '\u265E', P: '\u265F' };
const BRES = { checkmate: 'Xeque-mate', resign: 'Desistência', stalemate: 'Empate por afogamento', agreement: 'Empate por acordo', material: 'Empate: material insuficiente', '50': 'Empate: regra dos 50 lances', repetition: 'Empate por repetição', nomoves: 'Adversário sem jogadas', kings: 'Empate: 20 lances de damas sem captura' };
let BSEL = -1, BN = -1, BPROMO = null, BTURN = -1, BHEAD = '', BVIP = false;
function bgPiece(p, kind, cell) {
  if (kind === 'chess') { const w = p.c === 'w'; return `<span style="font-size:${Math.round(cell * 0.8)}px;line-height:1;color:${w ? '#fff' : '#1b1b1b'};-webkit-text-stroke:${w ? '1.2px #333' : '1px #ddd'};text-shadow:0 2px 3px rgba(0,0,0,.4)">${BGL[p.t]}\uFE0E</span>`; }
  const w = p.c === 'w';
  return `<span style="width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,${w ? '#fffdf5,#d9d0b8' : '#5a5a5a,#1d1d1d'});border:2px solid ${w ? '#b8ad8c' : '#000'};box-shadow:0 3px 4px rgba(0,0,0,.5);font-size:${Math.round(cell * 0.45)}px;color:#E9C46A">${p.t === 'K' ? '\u265B\uFE0E' : ''}</span>`;
}
function bgTap(i) {
  const v = S.view, legal = v.legal || []; if (!legal.length) return;
  if (BSEL >= 0) {
    const ms = legal.filter((m) => m[0] === BSEL && m[1] === i);
    if (ms.length) {
      if (v.kind === 'chess' && ms.some((m) => m[2])) { BPROMO = { from: BSEL, to: i }; return boardgame(BHEAD, BVIP); }
      GA.sfx('move'); buzz(20); socket.emit('game:action', { type: 'move', payload: { from: BSEL, to: i } }); BSEL = -1; return;
    }
  }
  if (legal.some((m) => m[0] === i)) { BSEL = i; GA.sfx('click'); } else BSEL = -1;
  boardgame(BHEAD, BVIP);
}
function boardgame(head, vip) {
  BHEAD = head; BVIP = vip;
  const v = S.view, kind = v.kind, me = v.me, flip = me === 'b', legal = v.legal || [];
  if (v.moves !== BN) { BSEL = -1; BPROMO = null; BN = v.moves; }
  if (BSEL >= 0 && !legal.some((m) => m[0] === BSEL)) { BSEL = -1; BPROMO = null; } // seleção inválida (vez mudou)
  if (v.turn === me && !v.over && BTURN !== v.moves) { BTURN = v.moves; buzz(120); GA.sfx('turn'); }
  const byS = {}; v.pieces.forEach((p) => (byS[p.y * 8 + p.x] = p));
  const canFrom = new Set(legal.map((m) => m[0])), tset = {}; legal.filter((m) => m[0] === BSEL).forEach((m) => (tset[m[1]] = 1));
  const cell = Math.floor(Math.min(window.innerWidth - 36, 460) / 8);
  let cells = '';
  for (let dy = 0; dy < 8; dy++) for (let dx = 0; dx < 8; dx++) {
    const x = flip ? 7 - dx : dx, y = flip ? 7 - dy : dy, i = y * 8 + x, dark = (x + y) % 2 === 1, p = byS[i];
    let bg = dark ? '#A9794A' : '#EAD9B5';
    if (v.last && (v.last.from === i || v.last.to === i)) bg = dark ? '#C2A24A' : '#E6D27A';
    if (v.check === i) bg = '#E5484D';
    let inner = p ? bgPiece(p, kind, cell) : '';
    if (tset[i]) inner += `<i style="position:absolute;width:${p ? '88%' : '30%'};height:${p ? '88%' : '30%'};border-radius:50%;${p ? 'border:4px solid rgba(46,196,182,.95)' : 'background:rgba(46,196,182,.9)'}"></i>`;
    const sel = BSEL === i ? 'outline:4px solid #FCA311;outline-offset:-4px;' : canFrom.has(i) ? 'box-shadow:inset 0 0 0 3px rgba(46,196,182,.6);' : '';
    cells += `<div data-sq="${i}" style="position:relative;display:flex;align-items:center;justify-content:center;background:${bg};${sel}">${inner}</div>`;
  }
  const colorName = me === 'w' ? '⚪ brancas' : '⚫ pretas';
  let status;
  if (v.over) status = (BRES[v.over.reason] || '') + (v.over.winner ? (v.over.winner === me ? ' — 🏆 você venceu!' : ' — você perdeu') : '');
  else status = (v.turn === me ? '<b>Sua vez</b>' : 'Vez do adversário') + (v.check >= 0 ? ' — <b style="color:#FF5A5F">XEQUE!</b>' : '');
  let ctl = '';
  if (BPROMO) ctl += `<div class="panel" style="margin-top:10px;text-align:center"><div style="margin-bottom:6px;font-weight:700">Promover a:</div><div style="display:flex;gap:8px;justify-content:center">${['Q', 'R', 'B', 'N'].map((t) => `<button class="btn ghost" data-promo="${t}" style="width:auto;padding:6px 16px;font-size:2rem">${BGL[t]}\uFE0E</button>`).join('')}</div></div>`;
  if (v.over) ctl += `<button class="btn" id="rematch" style="margin-top:12px">🔁 Revanche (trocar as cores)</button>` + (vip ? `<button class="btn ghost" id="end" style="margin-top:10px">Voltar ao menu</button>` : '');
  else if (v.drawOffer && v.drawOffer !== me) ctl += `<div class="panel" style="margin-top:12px;text-align:center">🤝 O adversário propôs empate<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" id="accd" style="background:var(--ok)">Aceitar</button><button class="btn ghost" id="decd">Recusar</button></div></div>`;
  else ctl += `<div style="display:flex;gap:10px;margin-top:12px"><button class="btn ghost" id="offd" ${v.drawOffer ? 'disabled' : ''} style="font-size:1rem;padding:12px">${v.drawOffer ? '🤝 Empate proposto…' : '🤝 Propor empate'}</button><button class="btn ghost" id="resg" style="font-size:1rem;padding:12px">🏳 Desistir</button></div>`;
  const lastTxt = v.history.length ? `<div style="text-align:center;opacity:.75;margin-top:6px">Último lance: <b>${esc(v.history[v.history.length - 1])}</b></div>` : '';
  $.innerHTML = head + `<div style="text-align:center;margin-bottom:6px">Você joga de <b>${colorName}</b></div><div style="text-align:center;font-size:1.15rem;margin-bottom:8px">${status}</div>` +
    `<div id="bgrid" style="display:grid;grid-template-columns:repeat(8,${cell}px);grid-auto-rows:${cell}px;width:${cell * 8}px;margin:0 auto;border-radius:8px;overflow:hidden;touch-action:manipulation;box-shadow:0 6px 20px rgba(0,0,0,.45)">${cells}</div>` + lastTxt + ctl;
  $id('bgrid').onclick = (e) => { const c = e.target.closest ? e.target.closest('[data-sq]') : null; if (c) bgTap(+c.dataset.sq); };
  document.querySelectorAll('[data-promo]').forEach((b) => (b.onclick = () => { const pr = BPROMO; BPROMO = null; BSEL = -1; GA.sfx('move'); socket.emit('game:action', { type: 'move', payload: { from: pr.from, to: pr.to, promo: b.dataset.promo } }); }));
  const on = (id, fn) => { if ($id(id)) $id(id).onclick = fn; };
  const send = (type) => () => { GA.sfx('click'); socket.emit('game:action', { type }); };
  on('rematch', send('rematch')); on('accd', send('acceptDraw')); on('decd', send('declineDraw')); on('offd', send('offerDraw'));
  on('resg', () => { if (confirm('Desistir da partida?')) { GA.sfx('cancel'); socket.emit('game:action', { type: 'resign' }); } });
  on('end', () => socket.emit('game:end'));
}

// ================= BANCO IMOBILIÁRIO (celular) =================
let BIS = { tab: 'play', trade: null, turnKey: '' };
const biName = (id) => { const p = S.players.find((x) => x.id === id); return p ? p.name : '?'; };
const biOwnsTradable = (v, who, i) => v.owner[i] === who && (BI.SQ[i].type !== 'prop' || BI.GROUPS[BI.SQ[i].group].every((j) => v.level[j] === 0));
function biPropCard(i) {
  const s = BI.SQ[i]; let rows = '';
  if (s.type === 'prop') rows = `Aluguel ${BI.fmt(s.rent[0])} · 1 casa ${BI.fmt(s.rent[1])} · 2: ${BI.fmt(s.rent[2])} · 3: ${BI.fmt(s.rent[3])} · 4: ${BI.fmt(s.rent[4])} · hotel ${BI.fmt(s.rent[5])}<br>Casa/hotel: ${BI.fmt(s.house)}`;
  else if (s.type === 'station') rows = 'Aluguel R$ 25 / 50 / 100 / 200 (1 a 4 estações)'; else rows = 'Aluguel: 4× o dado (10× com as duas companhias)';
  return `<div class="panel" style="border-left:10px solid ${s.group ? BI.GROUP[s.group].c : '#9aa5b1'};margin:10px 0"><b>${esc(s.name)}</b> — ${BI.fmt(s.price)}<br><small>${rows}</small><br><small>Hipoteca: ${BI.fmt(s.mort)}</small></div>`;
}
const biSide = (t) => [t.cash ? BI.fmt(t.cash) : '', ...t.props.map((i) => BI.SQ[i].name), t.cards ? '🎟 saída da prisão ×' + t.cards : ''].filter(Boolean).join(', ') || 'nada';
function biAct(type, payload, sfx) { GA.sfx(sfx || 'click'); buzz(20); socket.emit('game:action', { type, payload }); }

function bancoPhone(head, vip) {
  BHEAD2 = head; BVIP2 = vip;
  const v = S.view, me = v.players.find((p) => p.id === S.me), can = v.can, tk = BI.TOKENS[me.idx], SQ = BI.SQ, myTurn = v.turn === S.me;
  if (myTurn && v.phase === 'roll' && BIS.turnKey !== v.rollN + ':' + v.turn) { BIS.turnKey = v.rollN + ':' + v.turn; buzz([200, 80, 200]); GA.sfx('turn'); }
  if (BIS.trade && (v.trade || !can.trade)) BIS.trade = null;
  const sig = v.phase + ':' + v.turn + ':' + v.rollN + ':' + (can.bid ? 1 : 0) + ':' + (can.respond ? 1 : 0);
  if (sig !== BIS.sig) { BIS.sig = sig; if (v.phase === 'over' || can.buy || can.bid || can.respond || can.roll) BIS.tab = 'play'; } // decisão para você: volta para a aba Jogo
  const btn = (label, attr, cls, style) => `<button class="btn ${cls || ''}" ${attr} style="margin-top:10px;${style || ''}">${label}</button>`;
  let h = head + `<div class="panel" style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><div style="font-size:2rem;background:${tk.c};border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center">${tk.e}</div>
    <div style="flex:1"><div style="font-size:1.7rem;font-weight:800">${BI.fmt(me.cash)}</div><small style="opacity:.85">📍 ${esc(SQ[me.pos].name)}${me.inJail ? ' · 🔒 preso' : ''}${me.jailCards ? ' · 🎟×' + me.jailCards : ''}${me.bankrupt ? ' · FALIDO' : ''}</small></div></div>`;
  h += `<div style="display:flex;gap:8px;margin-bottom:6px">${[['play', '🎲 Jogo'], ['props', '🏠 Imóveis'], ['players', '👥 Jogadores']].map(([k, l]) => `<button class="btn ${BIS.tab === k ? '' : 'ghost'}" data-u="tab:${k}" style="padding:10px 4px;font-size:.95rem">${l}</button>`).join('')}</div>`;

  if (BIS.trade) h += biTradeUI(v, me);
  else if (BIS.tab === 'props') h += biPropsTab(v, me, can);
  else if (BIS.tab === 'players') h += v.players.map((p) => { const T = BI.TOKENS[p.idx], n = v.owner.filter((o) => o === p.id).length; return `<div class="panel" style="margin:8px 0;${p.bankrupt ? 'opacity:.4' : ''}"><div style="display:flex;align-items:center;gap:10px"><span style="background:${T.c};border-radius:50%;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:1.3rem">${T.e}</span><b style="flex:1">${esc(biName(p.id))}${v.turn === p.id ? ' ▶' : ''}</b><b>${BI.fmt(p.cash)}</b></div><small style="opacity:.8">📍 ${esc(SQ[p.pos].name)} · 🏠 ${n} imóvel(is)${p.inJail ? ' · 🔒 preso' : ''}${p.bankrupt ? ' · falido' : ''}</small></div>`; }).join('');
  else {
    if (v.phase === 'over') h += `<div class="panel" style="text-align:center;font-size:1.3rem;margin-top:10px">🏆 <b>${esc(biName(v.winner))}</b> venceu!</div>` + btn('🔁 Jogar de novo', 'data-a="rematch"', '') + (vip ? btn('Voltar ao menu', 'id="end"', 'ghost') : '');
    else if (me.bankrupt) h += `<div class="panel" style="margin-top:10px;text-align:center">💥 Você faliu. Acompanhe pela TV!</div>`;
    else {
      if (can.respond) h += `<div class="panel" style="margin-top:10px;border-left:8px solid var(--gold)">🤝 <b>${esc(biName(v.trade.from))}</b> propõe uma troca:<br>Ele dá: <b>${esc(biSide(v.trade.give))}</b><br>Ele pede: <b>${esc(biSide(v.trade.get))}</b><div style="display:flex;gap:10px">${btn('✅ Aceitar', 'data-a="acceptTrade"', '', 'background:var(--ok)')}${btn('Recusar', 'data-a="rejectTrade"', 'ghost')}</div></div>`;
      else if (can.cancelTrade) h += `<div class="panel" style="margin-top:10px">🤝 Aguardando ${esc(biName(v.trade.to))} responder…${btn('Cancelar proposta', 'data-a="cancelTrade"', 'ghost')}</div>`;
      if (v.phase === 'auction') {
        const a = v.auction; h += biPropCard(a.sq) + `<div class="panel" style="text-align:center">🔨 Leilão · maior lance: <b>${a.high ? BI.fmt(a.high) + ' (' + esc(biName(a.bidder)) + ')' : 'nenhum'}</b></div>`;
        if (can.bid) {
          const mn = can.bid.min, opts = [...new Set([mn, a.high + 25, a.high + 50, a.high + 100].map((x) => Math.max(x, mn)))].filter((x) => x <= can.bid.max);
          h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">${opts.map((x) => `<button class="btn" data-a="bid" data-amount="${x}" style="padding:14px 4px">${BI.fmt(x)}</button>`).join('')}</div>` + btn('Passar (sair do leilão)', 'data-a="pass"', 'ghost');
          if (!opts.length) h += `<p style="text-align:center;opacity:.8">Você não tem dinheiro para cobrir o lance mínimo.</p>`;
        } else h += `<p style="text-align:center;opacity:.8">Vez de ${esc(biName(a.cur))} dar o lance…</p>`;
      } else if (v.phase === 'debt') {
        if (v.debt.from === S.me) h += `<div class="panel" style="margin-top:10px;border-left:8px solid #FF5A5F">⚠ Você precisa pagar <b>${BI.fmt(v.debt.amount)}</b> (${esc(v.debt.reason)}) e tem ${BI.fmt(me.cash)}.<br><small>Na aba 🏠 Imóveis, venda construções ou hipoteque imóveis. O pagamento é automático quando o dinheiro bastar.</small></div>` + btn('🏳 Declarar falência', 'data-a="bankrupt"', 'ghost', 'background:#FF5A5F;color:#fff');
        else h += `<p style="text-align:center;opacity:.85">${esc(biName(v.debt.from))} precisa levantar dinheiro…</p>`;
      } else if (myTurn) {
        if (v.phase === 'roll') {
          h += btn('🎲 ROLAR OS DADOS', 'data-a="roll"', '', 'font-size:1.8rem;padding:26px;background:' + tk.c + ';color:#14213D');
          if (me.inJail) { h += `<p style="text-align:center;margin:10px 0 0">🔒 Você está na prisão. Tire dupla, pague ou use a carta.</p>`; if (can.payJail) h += btn('Pagar R$ 50 e sair', 'data-a="payJail"', 'ghost'); if (can.useCard) h += btn('🎟 Usar carta de saída', 'data-a="useCard"', 'ghost'); }
        } else if (v.phase === 'buy') {
          h += biPropCard(me.pos) + `<div style="display:flex;gap:10px">${btn('🏠 Comprar', 'data-a="buy"', '', 'background:var(--ok);color:#14213D')}${btn('🔨 Leiloar', 'data-a="decline"', 'ghost')}</div>`;
        } else if (v.phase === 'manage') h += btn('✅ Encerrar a vez', 'data-a="endTurn"', '', (can.endTurn ? '' : 'opacity:.4;') + 'background:var(--ok);color:#14213D');
        if (can.trade) h += btn('🤝 Propor troca', 'data-u="topen"', 'ghost');
        if (can.bankrupt) h += btn('🏳 Desistir da partida', 'data-a="bankrupt"', 'ghost', 'font-size:.9rem;padding:10px');
      } else h += `<p style="text-align:center;margin:16px 0;opacity:.9">Vez de <b>${esc(biName(v.turn))}</b>…</p>`;
      if (v.rollN > 0) h += `<p style="text-align:center;opacity:.7;margin:6px 0">Último lance dos dados: 🎲 ${v.dice[0]} + ${v.dice[1]} = ${v.dice[0] + v.dice[1]}</p>`;
    }
    h += `<div style="margin-top:14px;opacity:.75;font-size:.85rem;line-height:1.5">${v.log.slice(-4).map((l) => '<div>' + esc(l) + '</div>').join('')}</div>`;
  }
  const y = window.scrollY; $.innerHTML = h; window.scrollTo(0, y);
  $.onclick = biClick;
  if ($id('end')) $id('end').onclick = () => socket.emit('game:end');
}

function biPropsTab(v, me, can) {
  const mine = []; v.owner.forEach((o, i) => { if (o === S.me) mine.push(i); });
  if (!mine.length) return `<p style="text-align:center;opacity:.8;margin-top:20px">Você ainda não tem imóveis. Compre ao cair neles!</p>`;
  const SQ = BI.SQ;
  return `<div style="margin-top:8px">` + mine.map((i) => {
    const s = SQ[i], lv = v.level[i], col = s.group ? BI.GROUP[s.group].c : '#9aa5b1', cost = Math.ceil(s.mort * 1.1), b = [];
    if (can.build.includes(i)) b.push(`<button class="btn" data-a="build" data-sq="${i}" style="width:auto;padding:8px 12px;font-size:.9rem">🏗 ${lv === 4 ? 'Hotel' : 'Casa'} ${BI.fmt(s.house)}</button>`);
    if (can.sell.includes(i)) b.push(`<button class="btn ghost" data-a="sell" data-sq="${i}" style="width:auto;padding:8px 12px;font-size:.9rem">💵 Vender (+${BI.fmt(Math.floor(s.house / 2))})</button>`);
    if (can.mortgage.includes(i)) b.push(`<button class="btn ghost" data-a="mortgage" data-sq="${i}" style="width:auto;padding:8px 12px;font-size:.9rem">🏦 Hipotecar (+${BI.fmt(s.mort)})</button>`);
    if (can.unmortgage.includes(i)) b.push(`<button class="btn ghost" data-a="unmortgage" data-sq="${i}" style="width:auto;padding:8px 12px;font-size:.9rem">↩ Resgatar (${BI.fmt(cost)})</button>`);
    return `<div class="panel" style="border-left:10px solid ${col};margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b><span>${lv === 5 ? '🏨' : '🏠'.repeat(lv)}${v.mort[i] ? ' <small style="color:#FF5A5F">HIPOTECADA</small>' : ''}</span></div>
      <small style="opacity:.8">${s.type === 'prop' ? 'Aluguel agora: ' + BI.fmt(lv ? s.rent[lv] : s.rent[0] * (BI.GROUPS[s.group].every((j) => v.owner[j] === S.me) ? 2 : 1)) : s.type === 'station' ? 'Aluguel 25 a 200' : '4× ou 10× o dado'}</small>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${b.join('') || '<small style="opacity:.6">Sem ações agora (construir/hipotecar na sua vez)</small>'}</div></div>`;
  }).join('') + `</div>`;
}

function biTradeUI(v, me) {
  const t = BIS.trade, others = v.players.filter((p) => !p.bankrupt && p.id !== S.me);
  if (t.step === 'pick') return `<h3 style="margin:12px 0 6px">Trocar com quem?</h3>` + others.map((p) => `<button class="btn ghost" data-u="tpick:${p.id}" style="margin-bottom:8px;text-align:left">${BI.TOKENS[p.idx].e} ${esc(biName(p.id))} · ${BI.fmt(p.cash)}</button>`).join('') + `<button class="btn ghost" data-u="tback" style="margin-top:6px">Voltar</button>`;
  const other = v.players.find((p) => p.id === t.to);
  const sec = (side, who, title, cash) => {
    const tr = t[side], list = []; v.owner.forEach((o, i) => { if (biOwnsTradable(v, who, i)) list.push(i); });
    return `<div class="panel" style="margin:10px 0"><b>${title}</b>
      <div style="display:flex;align-items:center;gap:6px;margin:8px 0">${[-100, -10].map((d) => `<button class="btn ghost" data-u="tc:${side}:${d}" style="width:auto;padding:8px 10px">${d}</button>`).join('')}<b style="flex:1;text-align:center">${BI.fmt(tr.cash)}</b>${[10, 100].map((d) => `<button class="btn ghost" data-u="tc:${side}:${d}" style="width:auto;padding:8px 10px">+${d}</button>`).join('')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${list.map((i) => `<button class="btn ${tr.props.includes(i) ? '' : 'ghost'}" data-u="tp:${side}:${i}" style="width:auto;padding:6px 10px;font-size:.85rem;border-left:8px solid ${BI.GROUP[BI.SQ[i].group] ? BI.GROUP[BI.SQ[i].group].c : '#9aa5b1'}">${esc(BI.SQ[i].name)}${v.mort[i] ? ' (hip.)' : ''}</button>`).join('') || '<small style="opacity:.6">Sem imóveis negociáveis (grupos com construções não podem ser trocados)</small>'}</div>
      ${(side === 'give' ? me : other).jailCards ? `<div style="margin-top:8px">🎟 Carta da prisão: <button class="btn ghost" data-u="tk:${side}:-1" style="width:auto;padding:4px 10px">−</button> <b>${tr.cards}</b> <button class="btn ghost" data-u="tk:${side}:1" style="width:auto;padding:4px 10px">+</button></div>` : ''}</div>`;
  };
  return `<h3 style="margin:12px 0 0">Troca com ${esc(biName(t.to))}</h3>` + sec('give', S.me, 'Você oferece', me.cash) + sec('get', t.to, 'Você pede', other.cash) +
    `<div class="panel" style="text-align:center">Dá: <b>${esc(biSide(t.give))}</b><br>Pede: <b>${esc(biSide(t.get))}</b></div><button class="btn" data-u="tsend" style="margin-top:10px;background:var(--ok);color:#14213D">📨 Enviar proposta</button><button class="btn ghost" data-u="tback" style="margin-top:8px">Cancelar</button>`;
}

function biClick(e) {
  const b = e.target.closest ? e.target.closest('[data-a],[data-u]') : null; if (!b || b.disabled || !S || !S.view || S.view.kind !== 'banco') return;
  const v = S.view;
  if (b.dataset.a) {
    const a = b.dataset.a, SFX = { roll: 'dice', buy: 'home', build: 'ok', sell: 'move', mortgage: 'move', unmortgage: 'ok', acceptTrade: 'reveal', rematch: 'start' };
    if (a === 'bankrupt' && !confirm('Tem certeza? Você sairá da partida e perderá tudo.')) return;
    const payload = b.dataset.sq !== undefined ? { sq: +b.dataset.sq } : b.dataset.amount ? { amount: +b.dataset.amount } : undefined;
    return biAct(a, payload, SFX[a]);
  }
  const [k, x, y] = b.dataset.u.split(':'), t = BIS.trade;
  if (k === 'tab') BIS.tab = x;
  else if (k === 'topen') BIS.trade = { step: 'pick' };
  else if (k === 'tpick') BIS.trade = { step: 'edit', to: x, give: { cash: 0, props: [], cards: 0 }, get: { cash: 0, props: [], cards: 0 } };
  else if (k === 'tback') BIS.trade = null;
  else if (k === 'tc') { const who = x === 'give' ? S.me : t.to, max = v.players.find((p) => p.id === who).cash; t[x].cash = Math.max(0, Math.min(max, t[x].cash + +y)); }
  else if (k === 'tp') { const i = +y, a = t[x].props, at = a.indexOf(i); if (at >= 0) a.splice(at, 1); else a.push(i); }
  else if (k === 'tk') { const who = x === 'give' ? S.me : t.to, max = v.players.find((p) => p.id === who).jailCards; t[x].cards = Math.max(0, Math.min(max, t[x].cards + +y)); }
  else if (k === 'tsend') { GA.sfx('click'); socket.emit('game:action', { type: 'offerTrade', payload: { to: t.to, give: t.give, get: t.get } }); BIS.trade = null; return; }
  GA.sfx('click'); bancoPhone(BHEAD2, BVIP2);
}
let BHEAD2 = '', BVIP2 = false;

let lastPh = '', playKey = '';
// botão no canto superior direito, ao lado do som: ⭐ em partida = Encerrar (para todos); os demais = Sair
function updateTop() {
  const b = $id('exitbtn'), me = S && S.players.find((p) => p.id === S.me);
  if (!me) { b.hidden = true; return; }
  const inGame = S.phase === 'game', vip = S.me === S.vip;
  b.hidden = false;
  if (inGame && vip) {
    b.textContent = '⏹ Encerrar';
    b.onclick = () => { if (confirm('Encerrar a partida para todos e voltar ao menu?')) { GA.sfx('cancel'); socket.emit('game:end'); } };
  } else {
    b.textContent = '🚪 Sair';
    b.onclick = () => {
      if (!confirm(inGame ? 'Sair da partida?' : 'Sair da sala?')) return;
      GA.sfx('cancel'); socket.emit('player:leave'); localStorage.removeItem('me'); clearInterval(tick); S = null;
      form = { room: '', name: form.name, color: form.color, err: 'Você saiu da sala.' }; joinScreen();
    };
  }
}
const sndBtn = $id('snd'); const sndIcon = () => (sndBtn.textContent = GA.isOn() ? '🔊' : '🔇'); sndIcon();
sndBtn.onclick = () => { GA.unlock(); GA.toggle(); sndIcon(); };
document.addEventListener('pointerdown', (e) => {
  GA.unlock();
  const b = e.target.closest ? e.target.closest('button') : null;
  if (b && !b.disabled && b.id !== 'snd') GA.sfx('click');
});
