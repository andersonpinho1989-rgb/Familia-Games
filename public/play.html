<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Família Games</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script></head>
<body><div id="app" style="max-width:480px;margin:auto;padding:18px"></div>
<script>
const $ = document.getElementById('app'); const $id = (i) => document.getElementById(i); const socket = io(); let S = null, tick = null;
const COLORS = ['#FF5A5F', '#FCA311', '#2EC4B6', '#4D96FF', '#9B5DE5', '#F15BB5', '#8AC926', '#E9ECEF'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz = (n = 30) => navigator.vibrate?.(n);
const act = (type, payload) => { buzz(); socket.emit('game:action', { type, payload }); };
const saved = () => JSON.parse(localStorage.getItem('me') || 'null');
let form = { room: new URLSearchParams(location.search).get('room') || '', name: '', color: COLORS[3], err: '' };

socket.on('connect', () => { // reconexão silenciosa: reassume o mesmo jogador
  const me = saved(); if (!me) return joinScreen();
  socket.emit('player:join', me, (r) => { if (r.error) { localStorage.removeItem('me'); form.err = r.error; joinScreen(); } });
});
socket.on('disconnect', () => { document.body.style.opacity = .6; });
socket.on('toast', (m) => alert(m));
socket.on('state', (s) => { document.body.style.opacity = 1; S = s; render(); });

function joinScreen() {
  $.innerHTML = `<h1 style="font-size:2.4em;margin:.2em 0">Entrar na sala</h1>
    <p style="color:#F15BB5;min-height:1.4em">${esc(form.err)}</p>
    <input class="field" id="room" placeholder="Código (4 letras)" maxlength="4" value="${esc(form.room)}" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:1.8rem">
    <input class="field" id="name" placeholder="Seu nome" maxlength="12" value="${esc(form.name)}" style="margin-top:12px">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0">${COLORS.map((c) => `<button data-c="${c}" aria-label="cor" style="aspect-ratio:1;border-radius:50%;background:${c};border:${c === form.color ? '5px solid #fff' : '5px solid transparent'}"></button>`).join('')}</div>
    <button class="btn" id="go">Entrar</button>`;
  $.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { form.room = $id('room').value; form.name = $id('name').value; form.color = b.dataset.c; joinScreen(); }));
  $id('go').onclick = () => {
    form = { ...form, room: $id('room').value.toUpperCase(), name: $id('name').value };
    socket.emit('player:join', { code: form.room, name: form.name, color: form.color }, (r) => {
      if (r.error) { form.err = r.error; return joinScreen(); }
      localStorage.setItem('me', JSON.stringify({ code: form.room, playerId: r.playerId })); buzz(60);
    });
  };
}

function render() {
  clearInterval(tick);
  const me = S.players.find((p) => p.id === S.me); if (!me) return;
  const head = `<div class="chip" style="margin-bottom:14px"><i class="dot" style="background:${me.color}"></i>${esc(me.name)} · sala ${S.code}</div>`;
  const vip = S.me === S.vip;
  if (S.phase === 'lobby') {
    $.innerHTML = head + `<h2 style="margin:.2em 0">${vip ? 'Escolha o jogo' : 'Aguardando o ⭐ iniciar…'}</h2>` +
      S.games.map((g) => `<button class="btn ${S.gameId === g.id ? '' : 'ghost'}" data-g="${g.id}" ${!vip || !g.available ? 'disabled' : ''} style="margin-bottom:10px;text-align:left">${g.emoji} ${esc(g.name)} <small>${g.available ? `(${g.min}–${g.max})` : '· em breve'}</small></button>`).join('') +
      (vip ? `<button class="btn" id="start" ${S.gameId ? '' : 'disabled'} style="margin-top:8px;background:var(--ok)">Começar!</button>` : '');
    $.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => { buzz(); socket.emit('game:select', b.dataset.g); }));
    if (vip) document.getElementById('start').onclick = () => { buzz(60); socket.emit('game:start'); };
    return;
  }
  if (S.gameId === 'adedonha') return adedonha(head, vip);
  if (S.gameId === 'ludo') return ludo(head, vip);
}

function adedonha(head, vip) {
  const v = S.view;
  if (v.phase === 'playing') {
    const prev = [...document.querySelectorAll('.a')].map((i) => i.value); // preserva o que já foi digitado
    $.innerHTML = head + `<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:5em;font-weight:800;color:var(--gold);line-height:1">${v.letter}</div><div id="t" style="font-size:3em;font-weight:800"></div></div>` +
      v.cats.map((c, i) => `<label style="display:block;margin:10px 0 4px;font-weight:700">${esc(c)}</label><input class="field a" data-i="${i}" value="${esc(prev[i] || '')}" autocomplete="off" autocapitalize="words" placeholder="${v.letter}…">`).join('') +
      `<button class="btn" id="stop" style="margin-top:18px;background:#FF5A5F;color:#fff;font-size:2rem">STOP!</button>`;
    const get = () => [...document.querySelectorAll('.a')].map((i) => i.value);
    let deb; document.querySelectorAll('.a').forEach((i) => (i.oninput = () => { clearTimeout(deb); deb = setTimeout(() => act('draft', { answers: get() }), 300); }));
    $id('stop').onclick = () => { buzz([80, 40, 80]); socket.emit('game:action', { type: 'stop', payload: { answers: get() } }); };
    const off = Date.now() - v.serverNow, t = $id('t');
    const u = () => { t.textContent = Math.max(0, Math.ceil((v.endsAt - (Date.now() - off)) / 1000)); };
    u(); tick = setInterval(u, 250); return;
  }
  if (v.phase === 'results') {
    const mine = v.ranking.findIndex((r) => r.id === S.me) + 1;
    $.innerHTML = head + `<h2>Olhe a TV 📺</h2><p>Você está em <b>${mine}º</b> lugar.</p>` +
      (vip ? `<button class="btn" id="nx">Próxima rodada</button>` : '<p style="opacity:.7">Aguardando o ⭐…</p>');
    if (vip) $id('nx').onclick = () => act('next'); return;
  }
  $.innerHTML = head + `<h2>Fim de jogo! 🏆</h2>` + (vip ? `<button class="btn" id="end">Voltar ao menu</button>` : '');
  if (vip) $id('end').onclick = () => socket.emit('game:end');
}

// ================= LUDO (celular) =================
const LC = ['#E5484D', '#3BB273', '#F2C14E', '#4D96FF']; let lastBuzz = '';
function ludo(head, vip) {
  const v = S.view, col = LC[v.seat], tp = S.players.find((p) => p.id === v.turn) || { name: '?' }, mine = v.pos[S.me];
  const k = v.turn + v.phase + v.dice;
  if (v.myTurn && v.phase === 'roll' && k !== lastBuzz) { lastBuzz = k; buzz([200, 80, 200]); }
  const win = S.players.find((p) => p.id === v.winner), face = v.dice ? String.fromCodePoint(0x267F + v.dice) : '🎲';
  const title = v.phase === 'over' ? `🏆 ${esc(win?.name)} venceu!` : v.myTurn ? 'Sua vez!' : `Vez de ${esc(tp.name)}`;
  let h = head + `<div class="panel" style="border:5px solid ${col};text-align:center"><div style="font-size:1.5rem;font-weight:800">${title}</div>
    <div style="font-size:5.5rem;line-height:1.1">${face}</div><div style="opacity:.85;min-height:1.5em">${esc(v.msg || '')}</div></div>`;
  if (v.myTurn && v.phase === 'roll') h += `<button class="btn" id="roll" style="margin-top:16px;font-size:2rem;padding:28px;background:${col}">🎲 ROLAR DADO</button>`;
  else if (v.myTurn && v.phase === 'move') {
    h += `<p style="text-align:center;font-weight:700;margin:14px 0 8px">Toque na peça que quer mover</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">` +
      mine.map((p, i) => { const ok = v.movable.includes(i), lbl = p === -1 ? 'Na base' : p === 56 ? 'Em casa 🏁' : p > 50 ? 'Reta final' : `Casa ${p + 1}`;
        return `<button data-p="${i}" ${ok ? '' : 'disabled'} class="btn ${ok ? '' : 'ghost'}" style="background:${ok ? col : ''};padding:20px 8px"><span style="font-size:2.2rem">${i + 1}</span><br><small>${lbl}</small></button>`; }).join('') + '</div>';
  } else if (v.phase !== 'over') h += `<p style="text-align:center;opacity:.8;margin-top:14px">Suas peças: ${mine.filter((p) => p === -1).length} na base · ${mine.filter((p) => p >= 0 && p < 56).length} no tabuleiro · ${mine.filter((p) => p === 56).length}/4 em casa</p>`;
  if (v.phase === 'over' && vip) h += `<button class="btn" id="end" style="margin-top:16px">Voltar ao menu</button>`;
  $.innerHTML = h;
  if (document.getElementById('roll')) document.getElementById('roll').onclick = () => act('roll');
  document.querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => act('move', { piece: +b.dataset.p })));
  if (document.getElementById('end')) document.getElementById('end').onclick = () => socket.emit('game:end');
}
</script></body></html>
