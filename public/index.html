<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Família Games — TV</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script><script src="/themes.js"></script><script src="/audio.js"></script><script src="/dice.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="/ludo3d.js"></script><script src="/board2d.js"></script><script src="/board3d.js"></script><script src="/bidata.js"></script><script src="/biboard.js"></script><script src="/bi2d.js"></script><script src="/bi3d.js"></script></head>
<body><div id="ctl" style="position:fixed;top:1vw;right:1vw;display:flex;gap:10px;z-index:9">
  <button id="newroom" class="btn ghost" hidden style="width:auto;font-size:1rem;padding:10px 16px">🔄 Encerrar tudo e gerar novo QR Code</button>
  <button id="viewbtn" class="btn ghost" hidden style="width:auto;font-size:1rem;padding:10px 16px">🖥 Trocar para 2D</button>
  <button id="endbtn" class="btn ghost" hidden style="width:auto;font-size:1rem;padding:10px 16px">⏹ Encerrar partida</button>
  <button id="snd" class="btn ghost" style="width:auto;font-size:1.3rem;padding:8px 14px" aria-label="Som">🔊</button></div>
<div id="sndhint" style="position:fixed;bottom:1.5vw;left:50%;transform:translateX(-50%);background:var(--gold);color:#14213D;font-weight:800;padding:10px 22px;border-radius:999px;z-index:9">🔊 Clique (ou aperte OK no controle) para ativar o som</div>
<div id="app" style="font-size:clamp(18px,1.6vw,34px);padding:3vw"></div>
<script>
const $ = document.getElementById('app'); const socket = io(); let S = null, tick = null;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip = (p, extra = '') => `<span class="chip ${p.connected === false ? 'off' : ''}"><i class="dot" style="background:${p.color}"></i>${esc(p.name)}${extra}</span>`;
const byId = (id) => S.players.find((p) => p.id === id) || { name: '?', color: '#888' };

function start() {
  const saved = JSON.parse(sessionStorage.getItem('room') || 'null');
  const create = () => socket.emit('host:create', null, (r) => sessionStorage.setItem('room', JSON.stringify(r)));
  if (saved) socket.emit('host:resume', saved, (r) => r.error && create()); else create();
}
socket.on('connect', start); // roda também a cada reconexão automática
let BUILD = null;
socket.on('state', (s) => {
  if (BUILD && s.build && s.build !== BUILD) return location.reload(); // servidor atualizado: pega a versão nova
  BUILD = s.build; const prev = S; S = s;
  try { GA.setTheme(themeOf(s)); sounds(prev, s); } catch (e) {}
  try { render(); } catch (e) { $.innerHTML = '<h1>Erro na tela da TV</h1><pre style="white-space:pre-wrap;color:#FCA311">' + esc(e.stack || e.message) + '</pre>'; console.error(e); }
});

function render() {
  clearInterval(tick); clearTimeout(spinT);
  document.getElementById('endbtn').hidden = S.phase !== 'game';
  document.getElementById('newroom').hidden = S.phase !== 'lobby';
  const vb = document.getElementById('viewbtn'); vb.hidden = !(S.phase === 'game' && ['ludo', 'xadrez', 'dama', 'banco'].includes(S.gameId));
  vb.textContent = S.settings && S.settings.view === '2d' ? '🖥 Trocar para 3D' : '🖥 Trocar para 2D';
  if (L3 && !(S.phase === 'game' && S.gameId === 'ludo')) { L3.destroy(); L3 = null; }
  if (BG && !(S.phase === 'game' && (S.gameId === 'xadrez' || S.gameId === 'dama'))) { BG.destroy(); BG = null; BMODE = null; }
  if (BIB && !(S.phase === 'game' && S.gameId === 'banco')) { BIB.destroy(); BIB = null; BIMODE = null; }
  if (S.phase === 'lobby') return lobby();
  if (S.gameId === 'banco') return bancoTV();
  if (S.gameId === 'xadrez' || S.gameId === 'dama') return boardgame();
  if (S.gameId === 'adedonha') return adedonha();
  if (S.gameId === 'ludo') return ludo();
  $.innerHTML = '<h1>Jogo sem tela na TV: ' + esc(S.gameId) + '</h1>';
}

const optTxt = (o, val) => (o.labels && o.labels[val]) || (val + (o.suffix || ''));
function gameLine() {
  if (!S.gameId) return 'O jogador ⭐ escolhe o jogo no celular.';
  const g = S.games.find((x) => x.id === S.gameId), st = S.settings || {};
  return 'Jogo: <b>' + esc(g.name) + '</b>' + (g.options || []).map((o) => ' · ' + esc(o.label) + ': <b>' + esc(optTxt(o, st[o.key])) + '</b>').join('') + ' — o ⭐ pode iniciar.';
}
function pickTxt(p) {
  const g = S.games.find((x) => x.id === S.gameId);
  if (!g || !g.pick || !S.picks || S.picks[p.id] === undefined) return '';
  const sd = (THEMES[(S.settings || {}).theme] || THEMES.classic).seats[S.picks[p.id]];
  return ' ' + sd.e + ' ' + sd.n;
}
const themeOf = (s) => (s.phase === 'game' && s.gameId === 'ludo' && s.view ? s.view.theme : 'classic');
function lobby() {
  const url = `${location.origin}/play.html?room=${S.code}`;
  $.innerHTML = `<div style="display:grid;grid-template-columns:1fr auto;gap:4vw;align-items:center">
    <div><h1 style="font-size:2em;margin:0">Entre pelo celular</h1>
      <p style="opacity:.8;margin:.2em 0 1em">Escaneie o QR Code ou abra <b>${esc(location.host)}/play.html</b></p>
      <div style="font-size:7em;font-weight:800;letter-spacing:.12em;color:var(--gold);line-height:1">${S.code}</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:1.2em">${S.players.map((p) => chip(p, (p.id === S.vip ? ' ⭐' : '') + pickTxt(p))).join('') || '<span style="opacity:.6">Aguardando jogadores…</span>'}</div>
      <p style="opacity:.8;margin-top:1.5em">${gameLine()}</p></div>
    <div id="qr" style="background:#fff;padding:18px;border-radius:24px"></div></div>`;
  new QRCode(document.getElementById('qr'), { text: url, width: 360, height: 360 });
}

function clock(endsAt, serverNow) {
  lastTick = -1; const off = Date.now() - serverNow; // corrige diferença de relógio TV/servidor
  const el = document.getElementById('clock');
  const upd = () => { const s = Math.max(0, Math.ceil((endsAt - (Date.now() - off)) / 1000)); if (s <= 5 && s > 0 && s !== lastTick) { lastTick = s; GA.sfx('tick'); } if (el) { el.textContent = s; el.style.color = s <= 10 ? '#FF5A5F' : 'var(--ink)'; } };
  upd(); tick = setInterval(upd, 250);
}

const rank = (r) => r.map((x, i) => `<div class="panel" style="display:flex;justify-content:space-between;margin-bottom:10px">${chip(byId(x.id))}<b style="font-size:1.4em">${i + 1}º · ${x.score} pts</b></div>`).join('');

function adedonha() {
  const v = S.view;
  if (v.phase === 'draw' || v.phase === 'spinning') return adeDraw(v);
  if (v.phase === 'playing') {
    $.innerHTML = `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:4vw;align-items:center">
      <div class="pop" style="font-size:16em;font-weight:800;color:var(--gold);line-height:.9">${v.letter}</div>
      <div><h2 style="margin:0;opacity:.8">Rodada ${v.round}/${v.rounds}</h2>
        ${v.cats.map((c) => `<div class="panel" style="margin:10px 0;font-size:1.5em;font-weight:700">${esc(c)}</div>`).join('')}</div>
      <div style="text-align:center"><div id="clock" style="font-size:9em;font-weight:800"></div>
        <div style="display:grid;gap:8px;margin-top:1em">${S.players.map((p) => chip(p, ` <b>${v.filled[p.id] || 0}/${v.cats.length}</b>`)).join('')}</div></div></div>`;
    return clock(v.endsAt, v.serverNow);
  }
  if (v.phase === 'validating') {
    const cell = (c, cat) => c.e ? '<span style="opacity:.4">—</span>' :
      `<span style="${c.a ? '' : 'text-decoration:line-through;color:#FF5A5F'}">${esc(c.t)}</span>${c.a ? '' : ' <small style="color:#FF5A5F">inválida</small>'}${c.r ? ` <b style="background:#FF5A5F;color:#fff;border-radius:8px;padding:0 .4em">✗${c.r}</b>` : ''}`;
    $.innerHTML = `<h1 style="margin:0 0 .2em">🔎 Validação · letra ${v.letter}</h1>
      <p style="opacity:.85;margin:0 0 .6em">Confiram as respostas e <b>contestem pelo celular</b> as erradas. Se mais da metade dos outros contestar, a resposta é anulada.</p>
      <div style="overflow:auto"><table style="width:100%;border-collapse:separate;border-spacing:0 8px">
      <tr><th></th>${v.cats.map((c) => `<th style="text-align:left;opacity:.7">${esc(c)}</th>`).join('')}</tr>
      ${S.players.map((p) => `<tr class="panel"><td>${chip(p)}</td>${v.board[p.id].map((c, i) => `<td>${cell(c, i)}</td>`).join('')}</tr>`).join('')}</table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.6em"><span style="font-size:1.2em">✅ ${v.ready.length}/${S.players.length} prontos</span><span id="clock" style="font-size:2.6em;font-weight:800"></span></div>`;
    return clock(v.endsAt, v.serverNow);
  }
  if (v.phase === 'results') {
    $.innerHTML = `<h1 style="margin:0 0 .4em">Letra ${v.letter} — ${v.stopper ? esc(byId(v.stopper).name) + ' gritou STOP!' : 'Tempo esgotado'}</h1>
      <div style="overflow:auto"><table style="width:100%;border-collapse:separate;border-spacing:0 8px">
      <tr><th></th>${v.cats.map((c) => `<th style="text-align:left;opacity:.7">${esc(c)}</th>`).join('')}<th>Total</th></tr>
      ${S.players.map((p) => `<tr class="panel"><td>${chip(p)}</td>${v.results[p.id].cells.map((c) => `<td style="color:${c.pts ? (c.pts === 10 ? 'var(--ok)' : 'var(--gold)') : '#FF5A5F'}"><span style="${c.st === 'rejected' || c.st === 'invalid' ? 'text-decoration:line-through' : ''}">${esc(c.text) || '—'}</span> <b>${c.pts ? '+' + c.pts : ''}</b>${c.st === 'rejected' ? ' <small>contestada ✗' + c.rejects + '</small>' : c.st === 'invalid' ? ' <small>inválida</small>' : ''}</td>`).join('')}<td><b style="font-size:1.4em">${v.results[p.id].total}</b></td></tr>`).join('')}</table></div>
      <p style="opacity:.7">10 pts = resposta única · 5 pts = repetida · 0 = vazia ou letra errada. Qualquer jogador toca em “Próxima rodada ➜” no celular.</p>`;
    return;
  }
  $.innerHTML = `<h1 style="font-size:3em;margin:0 0 .4em">🏆 Resultado final</h1>${rank(v.ranking)}`;
}

// ================= LUDO (TV) =================
let LC = ['#E5484D', '#3BB273', '#F2C14E', '#4D96FF'], LT = THEMES.classic, OFF = [0, 13, 26, 39], STARS = [8, 21, 34, 47];
const RING = (() => { const r = []; for (let x = 1; x <= 5; x++) r.push([x, 6]); for (let y = 5; y >= 0; y--) r.push([6, y]); r.push([7, 0], [8, 0]);
  for (let y = 1; y <= 5; y++) r.push([8, y]); for (let x = 9; x <= 14; x++) r.push([x, 6]); r.push([14, 7], [14, 8]);
  for (let x = 13; x >= 9; x--) r.push([x, 8]); for (let y = 9; y <= 14; y++) r.push([8, y]); r.push([7, 14], [6, 14]);
  for (let y = 13; y >= 9; y--) r.push([6, y]); for (let x = 5; x >= 0; x--) r.push([x, 8]); r.push([0, 7], [0, 6]); return r; })();
const COL = (seat, k) => [[1 + k, 7], [7, 1 + k], [13 - k, 7], [7, 13 - k]][seat];
function cellOf(seat, p, i) {
  if (p < 0) { const ox = [0, 9, 9, 0][seat], oy = [0, 0, 9, 9][seat]; return [ox + [1, 4, 1, 4][i] + .5, oy + [1, 1, 4, 4][i] + .5]; }
  if (p <= 50) { const c = RING[(OFF[seat] + p) % 52]; return [c[0] + .5, c[1] + .5]; }
  if (p < 56) { const c = COL(seat, p - 51); return [c[0] + .5, c[1] + .5]; }
  const d = [[-.75, 0], [0, -.75], [.75, 0], [0, .75]][seat], s = (i - 1.5) * .22;
  return [7.5 + d[0] + (seat % 2 ? s : 0), 7.5 + d[1] + (seat % 2 ? 0 : s)];
}
function buildLudo(v) {
  let s = '<svg id="lboard" viewBox="0 0 15 15" style="height:100%;width:100%;background:' + LT.bg + ';border-radius:18px">';
  for (let k = 0; k < 4; k++) {
    const ox = [0, 9, 9, 0][k], oy = [0, 0, 9, 9][k], used = v.order.some((id) => v.seats[id] === k);
    s += `<rect x="${ox}" y="${oy}" width="6" height="6" fill="${LC[k]}" opacity="${used ? 1 : .25}"/><rect x="${ox + .7}" y="${oy + .7}" width="4.6" height="4.6" rx=".6" fill="${LT.paper}" opacity="${used ? 1 : .35}"/>`;
    if (used) s += `<text x="${ox + 3}" y="${oy + 3.6}" text-anchor="middle" font-size="2.4">${LT.seats[k].e}</text>`;
    for (let i = 0; i < 4; i++) { const [cx, cy] = cellOf(k, -1, i); s += `<circle cx="${cx}" cy="${cy}" r=".5" fill="${LC[k]}" opacity=".3"/>`; }
    for (let j = 0; j < 5; j++) { const [x, y] = COL(k, j); s += `<rect x="${x}" y="${y}" width="1" height="1" fill="${LC[k]}" stroke="${LT.bg}" stroke-width=".06"/>`; }
  }
  RING.forEach(([x, y], idx) => {
    const st = OFF.indexOf(idx);
    s += `<rect x="${x}" y="${y}" width="1" height="1" fill="${st >= 0 ? LC[st] : LT.paper}" stroke="${LT.bg}" stroke-width=".06"/>`;
    if (STARS.includes(idx)) s += `<text x="${x + .5}" y="${y + .72}" text-anchor="middle" font-size=".7" fill="#1B2B52">★</text>`;
  });
  const T = [[6, 6, 6, 9], [6, 6, 9, 6], [9, 6, 9, 9], [6, 9, 9, 9]];
  [0, 1, 2, 3].forEach((k) => s += `<polygon points="${T[k].join(',').replace(/(\d+),(\d+),(\d+),(\d+)/, '$1,$2 $3,$4')} 7.5,7.5" fill="${LC[k]}"/>`);
  v.order.forEach((id) => [0, 1, 2, 3].forEach((i) => {
    s += `<g class="pc" id="pc-${v.order.indexOf(id)}-${i}"><circle r=".36" fill="${LC[v.seats[id]]}" stroke="#fff" stroke-width=".08"/><text y=".13" text-anchor="middle" font-size=".4" font-weight="800" fill="#14213D">${i + 1}</text></g>`;
  }));
  return s + '</svg>';
}
function placeLudo(v) {
  const items = [], groups = {};
  v.order.forEach((id, n) => v.pos[id].forEach((p, i) => { const [x, y] = cellOf(v.seats[id], p, i); const it = { id, n, i, x, y }; items.push(it); const gk = x + ',' + y; (groups[gk] = groups[gk] || []).push(it); }));
  Object.values(groups).forEach((g) => g.length > 1 && g.forEach((it, k) => { const a = k * 2 * Math.PI / g.length; it.x += Math.cos(a) * .24; it.y += Math.sin(a) * .24; }));
  items.forEach((it) => { const el = document.getElementById(`pc-${it.n}-${it.i}`); el.style.transform = `translate(${it.x}px,${it.y}px)`; el.classList.toggle('hl', v.turn === it.id && v.movable.includes(it.i)); });
}
let LDIE = null, LD_N = null, L3 = null, LMODE = null;
function applyLudoTheme(id) { LT = THEMES[id] || THEMES.classic; LC = LT.seats.map((x) => x.c); }
const who = (v, id) => { const sd = LT.seats[v.seats[id]]; return sd.e + ' ' + sd.n + ' (' + byId(id).name + ')'; };
function buildBoard(v, want) { // monta o tabuleiro 3D ou 2D dentro de #lwrap
  const wrap = document.getElementById('lwrap');
  if (L3) { L3.destroy(); L3 = null; }
  wrap.innerHTML = '';
  if (want === '3d') { try { L3 = window.Ludo3D ? Ludo3D.create(wrap, v, { cellOf, LC, LT, RING, OFF, STARS, COL }) : null; } catch (e) { console.error(e); L3 = null; } }
  if (!L3) wrap.innerHTML = buildLudo(v); // 2D escolhido (ou sem WebGL)
  LMODE = want;
}
function ludo() {
  const v = S.view, $e = (i) => document.getElementById(i);
  applyLudoTheme(v.theme);
  const want = v.view === '2d' ? '2d' : '3d';
  if (!$e('lwrap')) {
    $.innerHTML = `<div style="display:flex;gap:2.5vw;align-items:center;justify-content:center;min-height:92vh">
      <div id="lwrap" style="flex:none;width:min(64vw,112vh);height:min(56vw,98vh)"></div>
      <div id="lside" style="flex:1;max-width:30vw">
        <div id="lpanel" class="panel" style="text-align:center;border:6px solid #fff;margin-bottom:16px">
          <div id="ltitle" style="font-size:1.3em;font-weight:800"></div>
          <div id="ldice" style="display:flex;justify-content:center;padding:.7em 0 .5em"></div>
          <div id="lmsg" style="min-height:1.6em;opacity:.9"></div>
          <div id="clock" style="font-size:1.6em;font-weight:800;opacity:.7"></div></div>
        <div id="lplayers"></div></div></div>`;
    LDIE = Dice.create($e('ldice'), 110); LD_N = null; L3 = null; LMODE = null;
  }
  if (LMODE !== want) buildBoard(v, want);
  if (L3) L3.update(v); else placeLudo(v);
  const col = LC[v.seats[v.turn]];
  $e('lpanel').style.borderColor = col; $e('ldice').style.setProperty('--pip', col);
  $e('ltitle').textContent = v.phase === 'over' ? '🏆 ' + who(v, v.winner) + ' venceu!' : 'Vez de ' + who(v, v.turn);
  if (LD_N === null) LDIE.set(v.dice || 1); else if (v.rollN !== LD_N) LDIE.roll(v.dice || 1);
  LD_N = v.rollN;
  $e('lmsg').textContent = v.msg || (v.phase === 'move' ? 'Escolhendo a peça…' : v.phase === 'roll' ? 'Role o dado no celular 🎲' : '');
  $e('lplayers').innerHTML = v.order.map((id) => { const sd = LT.seats[v.seats[id]], done = v.pos[id].filter((x) => x === 56).length;
    return `<div style="margin:8px 0"><span class="chip"><i class="dot" style="background:${sd.c}"></i>${sd.e} ${esc(sd.n)} · ${esc(byId(id).name)} <b>${v.turn === id && v.phase !== 'over' ? '▶' : ''} ${done}/4 🏁</b></span></div>`; }).join('');
  if (v.phase !== 'over') clock(v.endsAt, v.serverNow); else $e('clock').textContent = '';
}

// ================= XADREZ e DAMA (TV) =================
let BG = null, BMODE = null, BKIND = null;
const BRES = { checkmate: 'Xeque-mate', resign: 'Desistência', stalemate: 'Empate por afogamento', agreement: 'Empate por acordo', material: 'Empate: material insuficiente', '50': 'Empate: regra dos 50 lances', repetition: 'Empate por repetição', nomoves: 'Adversário sem jogadas', kings: 'Empate: 20 lances de damas sem captura' };
const BVAL = { P: 1, N: 3, B: 3, R: 5, Q: 9 };
function buildBG(v, kind, want) { // 3D ou 2D dentro de #bwrap
  const wrap = document.getElementById('bwrap');
  if (BG) { BG.destroy(); BG = null; }
  wrap.innerHTML = '';
  if (want === '3d' && window.Board3D) { try { BG = Board3D.create(wrap, v, kind); } catch (e) { console.error(e); BG = null; } }
  if (!BG) BG = Board2D.create(wrap, v, kind); // 2D escolhido (ou sem WebGL)
  BMODE = want;
}
function boardgame() {
  const v = S.view, kind = v.kind, want = v.view === '2d' ? '2d' : '3d', $e = (i) => document.getElementById(i);
  const nameOf = (c) => (c === 'w' ? '⚪ ' : '⚫ ') + byId(v.side[c]).name;
  if (!$e('bwrap') || BKIND !== kind) {
    $.innerHTML = `<div style="display:flex;gap:2.5vw;align-items:center;justify-content:center;min-height:92vh">
      <div id="bwrap" style="flex:none;width:min(62vw,90vh);height:min(62vw,90vh)"></div>
      <div id="bside" style="flex:1;max-width:30vw"><div id="bpl_b" class="panel" style="margin-bottom:12px"></div>
        <div id="bstat" class="panel" style="text-align:center;font-size:1.15em;font-weight:800;margin-bottom:12px"></div>
        <div id="bpl_w" class="panel" style="margin-bottom:12px"></div>
        <div id="bhist" class="panel" style="max-height:28vh;overflow:auto;font-size:.8em;line-height:1.55"></div></div></div>`;
    BG = null; BMODE = null; BKIND = kind;
  }
  if (BMODE !== want) buildBG(v, kind, want);
  BG.update(v);
  ['w', 'b'].forEach((c) => {
    const o = c === 'w' ? 'b' : 'w'; let cap = '', adv = '';
    if (kind === 'chess') {
      const mine = v.captured[o], theirs = v.captured[c], d = mine.reduce((a, t) => a + BVAL[t], 0) - theirs.reduce((a, t) => a + BVAL[t], 0);
      cap = mine.map((t) => `<span style="font-size:1.5em;color:${o === 'w' ? '#fff' : '#222'};-webkit-text-stroke:1px ${o === 'w' ? '#555' : '#bbb'}">${Board2D.GLYPH[t]}\uFE0E</span>`).join('');
      adv = d > 0 ? ' <b style="color:var(--ok)">+' + d + '</b>' : '';
    } else cap = v.lost[o] ? `<small>${v.lost[o]} peça(s) capturada(s)</small>` : '';
    $e('bpl_' + c).innerHTML = `<div style="font-weight:800;font-size:1.1em">${nameOf(c)}${v.turn === c && !v.over ? ' ▶' : ''}${adv}</div><div style="min-height:1.6em">${cap}</div>`;
  });
  let st;
  if (v.over) st = (BRES[v.over.reason] || '') + (v.over.winner ? ' — 🏆 ' + nameOf(v.over.winner) + ' venceu!' : '');
  else st = 'Vez de ' + nameOf(v.turn) + (v.check >= 0 ? ' — <span style="color:#FF5A5F">XEQUE!</span>' : '') + (v.drawOffer ? '<br><small>🤝 ' + esc(nameOf(v.drawOffer)) + ' propôs empate</small>' : '');
  $e('bstat').innerHTML = v.over ? esc(st) : st;
  let h = '';
  for (let i = 0; i < v.history.length; i += 2) h += `<div><span style="opacity:.6">${i / 2 + 1}.</span> ${esc(v.history[i])} &nbsp; ${esc(v.history[i + 1] || '')}</div>`;
  $e('bhist').innerHTML = h || '<span style="opacity:.6">Nenhum lance ainda</span>'; $e('bhist').scrollTop = $e('bhist').scrollHeight;
}

// ================= BANCO IMOBILIÁRIO (TV) =================
let BIB = null, BIMODE = null, BIDICE = null, BIN = null;
function buildBI(v, want) { // 3D ou 2D dentro de #biwrap
  const wrap = document.getElementById('biwrap');
  if (BIB) { BIB.destroy(); BIB = null; }
  wrap.innerHTML = '';
  if (want === '3d' && window.Bi3D) { try { BIB = Bi3D.create(wrap, v); } catch (e) { console.error(e); BIB = null; } }
  if (!BIB) BIB = Bi2D.create(wrap, v);
  BIMODE = want;
}
function bancoTV() {
  const v = S.view, want = v.view === '2d' ? '2d' : '3d', $e = (i) => document.getElementById(i), SQ = BI.SQ, fm = BI.fmt;
  const nm = (id) => byId(id).name, pl = (id) => v.players.find((p) => p.id === id), tk = (id) => BI.TOKENS[pl(id).idx];
  if (!$e('biwrap')) {
    $.innerHTML = `<div style="display:flex;gap:2vw;align-items:center;justify-content:center;min-height:92vh">
      <div id="biwrap" style="flex:none;width:min(60vw,92vh);height:min(60vw,92vh)"></div>
      <div id="biside" style="flex:1;max-width:33vw;display:flex;flex-direction:column;gap:10px">
        <div class="panel" style="text-align:center;border:6px solid #fff" id="bi_turn"><div id="bi_title" style="font-size:1.2em;font-weight:800"></div>
          <div style="display:flex;gap:1.4em;justify-content:center;padding:.5em 0"><div id="bid1"></div><div id="bid2"></div></div><div id="bi_msg" style="min-height:1.3em;opacity:.9;font-size:.9em"></div></div>
        <div id="bi_box"></div><div class="panel" id="bi_players"></div>
        <div class="panel" id="bi_log" style="max-height:19vh;overflow:auto;font-size:.72em;line-height:1.5"></div></div></div>`;
    BIDICE = [Dice.create($e('bid1'), 64), Dice.create($e('bid2'), 64)]; BIN = null; BIB = null; BIMODE = null;
  }
  if (BIMODE !== want) buildBI(v, want);
  BIB.update(v);
  const cur = tk(v.turn);
  $e('bi_turn').style.borderColor = cur.c; $e('bid1').style.setProperty('--pip', cur.c); $e('bid2').style.setProperty('--pip', cur.c);
  $e('bi_title').textContent = v.phase === 'over' ? '🏆 ' + nm(v.winner) + ' venceu!' : 'Vez de ' + cur.e + ' ' + nm(v.turn);
  if (BIN === null) { BIDICE[0].set(v.dice[0] || 1); BIDICE[1].set(v.dice[1] || 1); } else if (v.rollN !== BIN) { BIDICE[0].roll(v.dice[0] || 1); BIDICE[1].roll(v.dice[1] || 1); }
  BIN = v.rollN;
  $e('bi_msg').textContent = v.log.length ? v.log[v.log.length - 1] : '';
  const side = (t) => [t.cash ? fm(t.cash) : '', ...t.props.map((i) => SQ[i].name), t.cards ? '🎟 saída da prisão ×' + t.cards : ''].filter(Boolean).join(', ') || 'nada';
  let box = '';
  if (v.phase === 'over') box = `<div class="panel" style="text-align:center;font-size:1.4em;font-weight:800">🏆 ${esc(nm(v.winner))} é o grande vencedor!</div>`;
  else if (v.debt) box = `<div class="panel" style="border-left:8px solid #FF5A5F">⚠ <b>${esc(nm(v.debt.from))}</b> precisa levantar <b>${fm(v.debt.amount)}</b> (${esc(v.debt.reason)}). Vendendo ou hipotecando imóveis…</div>`;
  else if (v.auction) { const a = v.auction;
    box = `<div class="panel" style="border-left:8px solid ${SQ[a.sq].group ? BI.GROUP[SQ[a.sq].group].c : '#888'}">🔨 <b>Leilão: ${esc(SQ[a.sq].name)}</b> (${fm(SQ[a.sq].price)})<br>Maior lance: <b>${a.high ? fm(a.high) + ' — ' + esc(nm(a.bidder)) : 'nenhum'}</b><br>Vez de ${esc(nm(a.cur))} <span id="clock" style="float:right;font-weight:800"></span></div>`; }
  else if (v.trade) box = `<div class="panel" style="border-left:8px solid var(--gold)">🤝 <b>${esc(nm(v.trade.from))}</b> propõe a <b>${esc(nm(v.trade.to))}</b>:<br>dá: ${esc(side(v.trade.give))}<br>pede: ${esc(side(v.trade.get))}</div>`;
  else if (v.card) box = `<div class="panel" style="border-left:8px solid #2EC4B6">🎴 <b>${esc(nm(v.card.who))}</b>: ${esc(v.card.text)}</div>`;
  $e('bi_box').innerHTML = box;
  $e('bi_players').innerHTML = v.players.map((p) => { const T = BI.TOKENS[p.idx], n = v.owner.filter((o) => o === p.id).length;
    return `<div style="display:flex;align-items:center;gap:8px;margin:5px 0;${p.bankrupt ? 'opacity:.4;text-decoration:line-through' : ''}"><span style="background:${T.c};border-radius:50%;width:1.7em;height:1.7em;display:inline-flex;align-items:center;justify-content:center">${T.e}</span><b style="flex:1">${esc(nm(p.id))}${v.turn === p.id && v.phase !== 'over' ? ' ▶' : ''}${p.inJail ? ' 🔒' : ''}${p.jailCards ? ' 🎟' : ''}</b><span>🏠${n}</span><b>${fm(p.cash)}</b></div>`; }).join('') + (v.pot !== null ? `<div style="opacity:.8;margin-top:6px">🅿 Parada Livre: ${fm(v.pot)}</div>` : '') + `<div style="opacity:.6;font-size:.8em;margin-top:6px">Casas ${v.houses.used}/${v.houses.max} · Hotéis ${v.houses.hotels}/${v.houses.maxHotels}</div>`;
  $e('bi_log').innerHTML = v.log.map((l) => '<div>' + esc(l) + '</div>').join(''); $e('bi_log').scrollTop = $e('bi_log').scrollHeight;
  if (v.auction && v.auction.endsAt) clock(v.auction.endsAt, v.serverNow);
}

// ================= SOM, ENCERRAR e SORTEIO DE LETRA (TV) =================
let spinT = null, lastTick = -1;
function sounds(p, s) {
  if (!p) return;
  if (p.phase === 'lobby' && s.phase === 'lobby') { if (s.players.length > p.players.length) GA.sfx('join'); return; }
  if (p.phase === 'lobby' && s.phase === 'game') return GA.sfx('start');
  if (p.phase === 'game' && s.phase === 'lobby') return GA.sfx('cancel');
  if (s.phase !== 'game' || !p.view || !s.view) return;
  const a = p.view, b = s.view;
  if (s.gameId === 'ludo') {
    if (b.phase === 'over' && a.phase !== 'over') return GA.sfx('win');
    let ev = null;
    b.order.forEach((id) => b.pos[id].forEach((x, i) => {
      const o = a.pos[id] ? a.pos[id][i] : x; if (o === x) return;
      if (x === -1) ev = 'capture'; else if (x === 56 && ev !== 'capture') ev = 'home'; else if (!ev) ev = 'move';
    }));
    if (ev) return GA.sfx(ev);
    if (a.phase === 'roll' && b.phase !== 'roll' && b.dice) return GA.sfx('dice');
    if (b.phase === 'roll' && a.turn !== b.turn) GA.sfx('turn');
  } else if (s.gameId === 'banco') {
    const seen = Math.max(0, ...(a.evs || []).map((e) => e.n)), MAP = { dice: 'dice', salary: 'reveal', buy: 'home', rent: 'capture', card: 'turn', jail: 'error', free: 'ok', auction: 'start', bid: 'click', build: 'ok', sell: 'move', trade: 'reveal', bankrupt: 'cancel', win: 'win' };
    (b.evs || []).filter((e) => e.n > seen).slice(-3).forEach((e) => GA.sfx(MAP[e.type] || 'click'));
    if (b.moveN !== a.moveN && b.lastMove && b.lastMove.kind === 'step') GA.sfx('move');
  } else if (s.gameId === 'xadrez' || s.gameId === 'dama') {
    if (b.over && !a.over) return GA.sfx(b.over.winner ? 'win' : 'cancel');
    if (b.moves > a.moves) GA.sfx(b.check >= 0 ? 'check' : b.lastCap ? 'capture' : 'move');
    else if (b.drawOffer && !a.drawOffer) GA.sfx('turn');
  } else if (s.gameId === 'adedonha' && a.phase !== b.phase) {
    if (b.phase === 'draw') GA.sfx('turn'); else if (b.phase === 'playing') GA.sfx('start');
    else if (b.phase === 'validating') GA.sfx('stop'); else if (b.phase === 'results') GA.sfx('reveal'); else if (b.phase === 'final') GA.sfx('win');
  }
}

function adeDraw(v) {
  const prevUsed = v.used.filter((l) => !(v.phase === 'spinning' && l === v.letter));
  const grid = v.alphabet.map((l) => `<span style="display:inline-block;width:1.7em;text-align:center;margin:4px;border-radius:10px;font-weight:800;background:var(--panel);opacity:${prevUsed.includes(l) ? .25 : 1};${prevUsed.includes(l) ? 'text-decoration:line-through;' : ''}">${l}</span>`).join('');
  $.innerHTML = `<div style="display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;min-height:85vh">
    <div id="spin" style="font-size:15em;font-weight:800;color:var(--gold);width:1.1em;text-align:center;line-height:1.15;background:var(--panel);border-radius:.15em">?</div>
    <div><h1 style="margin:0">Rodada ${v.round}/${v.rounds}</h1>
      <h2 style="margin:.3em 0">${v.phase === 'draw' ? esc(byId(v.drawer).name) + ', gire a letra no seu celular! 🎰' : 'Sorteando a letra… 🎰'}</h2>
      <div style="opacity:.8;margin-top:1.2em">Cada letra só sai uma vez na partida:</div><div>${grid}</div></div></div>`;
  if (v.phase === 'spinning') runSpin(v, prevUsed);
}
function runSpin(v, prevUsed) {
  const el = document.getElementById('spin'), end = v.spinEndsAt + (Date.now() - v.serverNow);
  const set = v.alphabet.filter((l) => !prevUsed.includes(l));
  (function step() {
    const left = end - Date.now();
    if (left <= 150) { el.textContent = v.letter; el.classList.add('pop'); GA.sfx('reveal'); return; }
    el.textContent = set[Math.floor(Math.random() * set.length)]; GA.sfx('tick');
    spinT = setTimeout(step, left > 1800 ? 70 : left > 900 ? 140 : 240);
  })();
}
